<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Aura AR - Hand Tracking</title>
    
    <!-- MediaPipe Hands CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #050510;
            --text-color: #ffffff;
            --glass-bg: rgba(20, 25, 40, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(16px);
            --accent: #00ffcc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .video-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
        }

        .input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 0;
            filter: brightness(0.6) contrast(1.1);
        }

        #bgCanvas, #drawCanvas, #mainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #bgCanvas {
            z-index: 1;
            pointer-events: none;
        }

        #drawCanvas {
            z-index: 3;
            pointer-events: none;
        }

        #mainCanvas {
            z-index: 5;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            min-width: 200px;
        }
        .stat:last-child { margin-bottom: 0; }
        .stat span.val { font-weight: bold; color: var(--accent); }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            pointer-events: auto;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .control-btn.active {
            background: rgba(0, 255, 204, 0.3);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        #themes {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 8px;
            transition: opacity 0.5s;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 500;
        }
        
        .theme-btn.active {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
            text-shadow: 0 0 10px white;
        }

        #startOverlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }

        .start-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .start-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .start-title {
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 6px;
            font-size: 3rem;
            background: linear-gradient(45deg, #ff00cc, #00f0ff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .start-subtitle {
            margin-bottom: 40px;
            color: #888;
            text-align: center;
            max-width: 600px;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: none;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.5);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 204, 0.8);
        }

        .developer-credits {
            padding-bottom: 30px;
        }

        .credit-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .developer-label {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        .developer-name {
            background: linear-gradient(45deg, #00ffcc, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-align: center;
            margin: 5px 0;
        }

        .developer-email {
            margin: 8px 0 0 0;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
        }

        .developer-email a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 2px;
        }

        .developer-email a:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .instructions {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            z-index: 10;
            text-align: center;
        }

        @media (max-width: 768px) {
            .start-title {
                font-size: 2rem;
                letter-spacing: 3px;
            }
            .start-subtitle {
                font-size: 0.95rem;
                padding: 0 20px;
            }
            .credit-card {
                padding: 15px 30px;
            }
            .developer-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Start Overlay -->
    <div id="startOverlay">
        <div class="start-content">
            <div class="start-main">
                <h1 class="start-title">NEON AURA AR</h1>
                <p class="start-subtitle">
                    ✋ ارفع إصبع السبابة فقط للرسم في الهواء<br>
                    🖐️ افتح يدك للتحكم والتفاعل<br>
                    ⚡ اضم إصبعين لإطلاق الموجات الصدمية
                </p>
                <button class="start-btn" id="startBtn">🚀 ابدأ التجربة</button>
            </div>
            
            <!-- Developer Credits -->
            <div class="developer-credits">
                <div class="credit-card">
                    <p class="developer-label">DEVELOPED BY</p>
                    <p class="developer-name">SAIF ABUROK</p>
                    <p class="developer-email">
                        <span style="color: var(--accent);">📧</span> 
                        <a href="mailto:saifrok@proton.me">saifrok@proton.me</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Container -->
    <div class="video-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <!-- HUD Interface -->
    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">اليدين: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">FPS: <span class="val" id="ui-fps">0</span></div>
        </div>
        <div class="panel">
            <div class="stat">الحالة: <span class="val" id="ui-gesture">عادي</span></div>
            <div class="stat">الوضع: <span class="val" id="ui-mode">عرض</span></div>
        </div>
    </div>

    <!-- Controls -->
    <div id="controls" class="hidden">
        <button class="control-btn" id="clearBtn">🗑️ مسح الرسم</button>
        <button class="control-btn" id="toggleDrawBtn">✏️ رسم تلقائي</button>
    </div>

    <!-- Theme Selector -->
    <div id="themes" class="hidden">
        <button class="theme-btn active" data-theme="Rainbow">🌈 قوس قزح</button>
        <button class="theme-btn" data-theme="Cyberpunk">🤖 سايبربانك</button>
        <button class="theme-btn" data-theme="Lava">🔥 حمم</button>
        <button class="theme-btn" data-theme="Ocean">🌊 محيط</button>
        <button class="theme-btn" data-theme="Galaxy">🌌 مجرة</button>
    </div>

    <!-- Instructions -->
    <div class="instructions hidden" id="instructions">
        ✋ ارفع إصبع السبابة فقط للرسم في الهواء | 🖐️ افتح يدك للتأثيرات | ⚡ اضم إصبعين للموجات
    </div>

<script>
// ============================================
// GLOBAL VARIABLES & CONFIGURATION
// ============================================
const videoElement = document.querySelector('.input_video');
const bgCanvas = document.getElementById('bgCanvas');
const drawCanvas = document.getElementById('drawCanvas');
const mainCanvas = document.getElementById('mainCanvas');
const bgCtx = bgCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');
const ctx = mainCanvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;

let time = 0;
let lastTime = performance.now();
let framesThisSecond = 0;
let lastFpsTime = performance.now();

let currentHands = [];
let handVelocities = 0;
let lastDrawPos = null;
let isDrawing = false;
let autoDrawMode = false;

// Theme System
let currentTheme = 'Rainbow';
const themes = {
    'Rainbow':   (t, index, total) => `hsl(${(t * 100 + index * (360/total)) % 360}, 100%, 60%)`,
    'Cyberpunk': (t, index, total) => (index % 2 === 0) ? '#ff003c' : '#00f0ff',
    'Lava':      (t, index, total) => `hsl(${(10 + (index * 10)) % 40}, 100%, ${50 + Math.sin(t)*10}%)`,
    'Ocean':     (t, index, total) => `hsl(${180 + (index * 20)}, 100%, 60%)`,
    'Galaxy':    (t, index, total) => `hsl(${260 + Math.sin(t*2 + index)*40}, 100%, 65%)`
};

// Physics & Effects
let particles = [];
let ripples = [];
const FINGER_TIPS = [4, 8, 12, 16, 20];

// Background Matrix Effect
let matrixColumns = [];
const fontSize = 16;
let maxColumns = 0;

// Audio System
let audioCtx = null;
let humOsc = null;
let humGain = null;

// UI Elements
const uiHands = document.getElementById('ui-hands');
const uiFps = document.getElementById('ui-fps');
const uiGesture = document.getElementById('ui-gesture');
const uiMode = document.getElementById('ui-mode');

// ============================================
// INITIALIZATION FUNCTIONS
// ============================================
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    bgCanvas.width = width;
    bgCanvas.height = height;
    drawCanvas.width = width;
    drawCanvas.height = height;
    mainCanvas.width = width;
    mainCanvas.height = height;
    
    maxColumns = Math.floor(width / fontSize);
    matrixColumns = new Array(maxColumns).fill(1).map(() => Math.random() * height/fontSize);
}

window.addEventListener('resize', resize);
resize();

// ============================================
// UI CONTROLS & EVENT LISTENERS
// ============================================
document.getElementById('clearBtn').addEventListener('click', () => {
    drawCtx.clearRect(0, 0, width, height);
});

document.getElementById('toggleDrawBtn').addEventListener('click', (e) => {
    autoDrawMode = !autoDrawMode;
    e.target.classList.toggle('active');
    uiMode.innerText = autoDrawMode ? '✏️ رسم تلقائي' : '👁️ عرض';
});

document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTheme = e.target.getAttribute('data-theme');
    });
});

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
    document.getElementById('themes').classList.remove('hidden');
    document.getElementById('instructions').classList.remove('hidden');
    initAudio();
    initMediaPipe();
    requestAnimationFrame(renderLoop);
});

// ============================================
// AUDIO SYSTEM
// ============================================
function initAudio() {
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        humOsc = audioCtx.createOscillator();
        humGain = audioCtx.createGain();
        humOsc.type = 'sine';
        humOsc.frequency.value = 100;
        humGain.gain.value = 0;
        humOsc.connect(humGain);
        humGain.connect(audioCtx.destination);
        humOsc.start();
    } catch(e) {
        console.error("Web Audio API failed", e);
    }
}

function triggerZap() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function updateHum(activeHands) {
    if (!audioCtx || !humGain) return;
    if (activeHands.length < 2) {
        humGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        return;
    }
    const p1 = activeHands[0][8];
    const p2 = activeHands[1][8];
    const dx = p1.x - p2.x;
    const dy = p1.y - p2.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const targetFreq = 100 + (1 - Math.min(dist, 1)) * 300;
    const targetVolume = 0.05 + (1 - Math.min(dist, 1)) * 0.15;
    humOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
    humGain.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.1);
}

// ============================================
// UTILITY FUNCTIONS
// ============================================
function getDist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

function mapToCanvas(point) {
    return { x: point.x * width, y: point.y * height };
}

// ============================================
// GESTURE DETECTION
// ============================================
function detectDrawingGesture(hand) {
    const palm = hand[0];
    const thumb = hand[4];
    const index = hand[8];
    const middle = hand[12];
    const ring = hand[16];
    const pinky = hand[20];
    
    const indexDist = getDist(palm, index);
    const middleDist = getDist(palm, middle);
    const ringDist = getDist(palm, ring);
    const pinkyDist = getDist(palm, pinky);
    
    const indexExtended = indexDist > 0.3;
    const othersFolded = middleDist < 0.25 && ringDist < 0.22 && pinkyDist < 0.2;
    
    return indexExtended && othersFolded;
}

let lastPinchState = [false, false];

function detectGestures() {
    if (!currentHands.length) {
        isDrawing = false;
        lastDrawPos = null;
        uiGesture.innerText = "عادي";
        return;
    }
    
    const hand = currentHands[0];
    const shouldDraw = detectDrawingGesture(hand) || autoDrawMode;
    
    if (shouldDraw) {
        const indexTip = mapToCanvas(hand[8]);
        
        if (lastDrawPos) {
            const color = themes[currentTheme](time, 1, 1);
            
            drawCtx.beginPath();
            drawCtx.moveTo(lastDrawPos.x, lastDrawPos.y);
            drawCtx.lineTo(indexTip.x, indexTip.y);
            drawCtx.strokeStyle = color;
            drawCtx.lineWidth = 8;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.shadowBlur = 20;
            drawCtx.shadowColor = color;
            drawCtx.stroke();
            drawCtx.shadowBlur = 0;
            
            createParticles(indexTip, color, 2);
        }
        
        lastDrawPos = indexTip;
        isDrawing = true;
        uiGesture.innerText = "🎨 رسم";
    } else {
        lastDrawPos = null;
        isDrawing = false;
        
        currentHands.forEach((hand, idx) => {
            const thumb = hand[4];
            const index = hand[8];
            const dist = getDist(thumb, index);
            const isPinching = dist < 0.05;
            
            if (isPinching && !lastPinchState[idx]) {
                const midpoint = {
                    x: (thumb.x + index.x) / 2, 
                    y: (thumb.y + index.y) / 2
                };
                createShockwave(mapToCanvas(midpoint), themes[currentTheme](time, 1, 1));
                triggerZap();
                uiGesture.innerText = "⚡ قرصة";
            }
            lastPinchState[idx] = isPinching;
        });
        
        if (!lastPinchState.includes(true)) {
            uiGesture.innerText = "👋 يد مفتوحة";
        }
    }
}

// ============================================
// VISUAL EFFECTS
// ============================================
function createParticles(pos, color, count = 3) {
    for (let i=0; i<count; i++) {
        particles.push({
            x: pos.x,
            y: pos.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function createShockwave(pos, color) {
    ripples.push({
        x: pos.x,
        y: pos.y,
        radius: 0,
        maxRadius: 150 + Math.random() * 100,
        life: 1.0,
        color: color
    });
}

function drawBackground() {
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.fillStyle = `rgba(0, 0, 0, ${0.15 + Math.min(handVelocities*10, 0.5)})`;
    bgCtx.fillRect(0, 0, width, height);
    bgCtx.globalCompositeOperation = 'source-over';

    bgCtx.fillStyle = themes[currentTheme](time, 1, 1);
    bgCtx.font = fontSize + "px monospace";
    
    let speedMult = 1 + (handVelocities * 100);

    for (let i = 0; i < matrixColumns.length; i++) {
        if (Math.random() > 0.95) {
            const char = String.fromCharCode(0x30A0 + Math.random() * 96);
            bgCtx.fillText(char, i * fontSize, matrixColumns[i] * fontSize);
        }
        matrixColumns[i] += Math.random() * speedMult;
        if (matrixColumns[i] * fontSize > height && Math.random() > 0.9) {
            matrixColumns[i] = 0;
        }
    }
}

function updatePhysics() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.vy += 0.1;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
        } else {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fill();
        }
    }
    
    for (let i = ripples.length - 1; i >= 0; i--) {
        let r = ripples[i];
        r.radius += (r.maxRadius - r.radius) * 0.1;
        r.life -= 0.03;
        
        if (r.life <= 0) {
            ripples.splice(i, 1);
        } else {
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.strokeStyle = r.color;
            ctx.lineWidth = 4 * r.life;
            ctx.globalAlpha = r.life;
            ctx.stroke();
        }
    }
    ctx.globalAlpha = 1.0;
}

// ============================================
// MAIN RENDER LOOP
// ============================================
function renderLoop(timestamp) {
    requestAnimationFrame(renderLoop);
    
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    time += dt;

    framesThisSecond++;
    if (timestamp > lastFpsTime + 1000) {
        uiFps.innerText = framesThisSecond;
        framesThisSecond = 0;
        lastFpsTime = timestamp;
    }

    drawBackground();

    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(0, 0, width, height);
    ctx.globalCompositeOperation = 'source-over';

    updatePhysics();

    if (currentHands.length > 0) {
        currentHands.forEach((hand, handIndex) => {
            const glowColor = themes[currentTheme](time, handIndex, 2);
            
            const connections = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20],
                [5,9],[9,13],[13,17]
            ];
            
            connections.forEach(([start, end]) => {
                const pt1 = mapToCanvas(hand[start]);
                const pt2 = mapToCanvas(hand[end]);
                
                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                ctx.strokeStyle = glowColor;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = glowColor;
                ctx.stroke();
            });
            
            ctx.shadowBlur = 0;
            
            hand.forEach((landmark, idx) => {
                const pt = mapToCanvas(landmark);
                const isFingerTip = FINGER_TIPS.includes(idx);
                const isIndexFinger = idx === 8;
                
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, isIndexFinger && isDrawing ? 10 : (isFingerTip ? 6 : 3), 0, Math.PI * 2);
                ctx.fillStyle = isIndexFinger && isDrawing ? '#00ff00' : (isFingerTip ? '#ffffff' : glowColor);
                
                if (isFingerTip) {
                    ctx.shadowBlur = isIndexFinger && isDrawing ? 30 : 15;
                    ctx.shadowColor = isIndexFinger && isDrawing ? '#00ff00' : glowColor;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        });

        if (currentHands.length >= 2) {
            const h1 = currentHands[0];
            const h2 = currentHands[1];

            FINGER_TIPS.forEach((tipIndex, idx) => {
                const pt1 = mapToCanvas(h1[tipIndex]);
                const pt2 = mapToCanvas(h2[tipIndex]);
                const dist = Math.hypot(pt2.x - pt1.x, pt2.y - pt1.y);
                
                const col = themes[currentTheme](time, idx, FINGER_TIPS.length);
                
                if (dist < 150 && Math.random() > 0.7) {
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    const midX = (pt1.x + pt2.x)/2 + (Math.random() - 0.5) * 30;
                    const midY = (pt1.y + pt2.y)/2 + (Math.random() - 0.5) * 30;
                    ctx.lineTo(midX, midY);
                    ctx.lineTo(pt2.x, pt2.y);
                    ctx.strokeStyle = '#ffffff';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = col;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.moveTo(pt1.x, pt1.y);
                ctx.lineTo(pt2.x, pt2.y);
                
                let grad = ctx.createLinearGradient(pt1.x, pt1.y, pt2.x, pt2.y);
                grad.addColorStop(0, themes[currentTheme](time, idx, 5));
                grad.addColorStop(0.5, themes[currentTheme](time, idx + 1, 5));
                grad.addColorStop(1, themes[currentTheme](time, idx + 2, 5));
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 8;
                ctx.shadowColor = col;
                ctx.stroke();
                ctx.shadowBlur = 0;
            });
        }
        
        detectGestures();
    }
}

// ============================================
// MEDIAPIPE HAND TRACKING INITIALIZATION
// ============================================
function initMediaPipe() {
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1, 
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        if (!audioCtx) return;

        uiHands.innerText = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;
        
        if (currentHands.length > 0 && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            let vSum = 0;
            const oldP = currentHands[0][8];
            const newP = results.multiHandLandmarks[0][8];
            if (oldP && newP) {
                vSum += getDist(oldP, newP);
                handVelocities = vSum; 
            }
        } else {
            handVelocities = 0;
        }

        currentHands = results.multiHandLandmarks || [];
        updateHum(currentHands);
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 1280,
        height: 720,
        facingMode: 'user'
    });
    
    camera.start();
}
